openapi: 3.0.3
info:
  title: Invoice Generator - Email Sender Service
  description: Microservice responsible for sending invoice emails with PDF attachments via Resend API.
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Local development server

paths:
  /:
    get:
      summary: Health check
      operationId: healthCheck
      tags:
        - App
      responses:
        '200':
          description: Service is running
          content:
            text/plain:
              schema:
                type: string
                example: Hello World!

  /email:
    post:
      summary: Send invoice email
      description: >
        Sends an email with the invoice PDF attached. Uses the Resend API
        for email delivery.
      operationId: sendEmail
      tags:
        - Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailDto'
      responses:
        '200':
          description: Email sent successfully
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    EmailDto:
      type: object
      required:
        - email
        - file
      properties:
        email:
          type: string
          description: Recipient email address
          example: john@example.com
        file:
          description: PDF file content to attach to the email
          oneOf:
            - type: string
              format: binary
            - type: object

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status code
          example: 500
        message:
          type: string
          description: Error message
          example: Failed to send email
